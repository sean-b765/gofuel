name: Build docker image and push to ECR

on:
  push:
    branches: ['master']

env:
  AWS_REGION: ap-southeast-2
  ECR_REPOSITORY: gofuel
  ROLE: arn:aws:iam::476720619618:role/gofuel-cicd-deploy-role

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build, tag, and push image to Amazon ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          BASE_PATH: ${{ vars.BASE_PATH }}
        run: |
          # Build the API image (default FUNCTION=api/prod) and the cron image
          # (FUNCTION=cron), tag each, and push to ECR so lambdas can pull.
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
                       --build-arg BASE_PATH=$BASE_PATH .
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:cron-$IMAGE_TAG \
                       -t $ECR_REGISTRY/$ECR_REPOSITORY:cron-latest \
                       --build-arg FUNCTION=cron .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY --all-tags
          echo "api-image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "cron-image=$ECR_REGISTRY/$ECR_REPOSITORY:cron-$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Lambda with new build image
        id: deploy-image
        env:
          LAMBDA_API_ARN: ${{ vars.LAMBDA_API_ARN }}
          LAMBDA_CRON_ARN: ${{ vars.LAMBDA_CRON_ARN }}
          API_IMAGE: ${{ steps.build-image.outputs.api-image }}
          CRON_IMAGE: ${{ steps.build-image.outputs.cron-image }}
        run: |
          aws lambda update-function-code --function-name $LAMBDA_API_ARN --image-uri $API_IMAGE --region $AWS_REGION
          aws lambda update-function-code --function-name $LAMBDA_CRON_ARN --image-uri $CRON_IMAGE --region $AWS_REGION
